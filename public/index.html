<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="appTitle"></title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-left">
                <div class="search-wrapper">
                    <input type="text" id="tagInput" data-i18n-placeholder="filterByTags" autocomplete="off" />
                </div>
            </div>
            <div class="topbar-right">
                <button id="uploadBtn" class="primary-btn rounded" data-i18n="upload">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button id="viewBtn" data-i18n-title="favorites">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
                <button id="userBtn" data-i18n-title="settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button id="logoutBtn" data-i18n-title="logout">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
                <button id="clearAllTagsBtn" class="clear-tags-btn hidden" data-i18n-title="clearFilters">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
        </header>

        <div id="tagsContainer" class="tags-container"></div>

        <div id="favoritesTabs" class="favorites-tabs hidden">
            <button class="fav-tab-btn active" data-tab="all" data-i18n="all"></button>
            <button class="fav-tab-btn" data-tab="images" data-i18n="images"></button>
            <button class="fav-tab-btn" data-tab="videos" data-i18n="videos"></button>
            <button class="fav-tab-btn" data-tab="gifs" data-i18n="animations"></button>
        </div>

        <div class="pagination-bar">
            <button id="prevPageBtn" class="pagination-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <div class="pagination-pages" id="paginationPages"><span class="page-indicator" data-i18n="page"></span></div>
            <button id="nextPageBtn" class="pagination-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>

        <main id="gallery" class="gallery"></main>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden"><div class="loader"></div></div>

    
    <div id="viewer" class="viewer hidden">
        <div class="viewer-overlay"></div>
        <button id="viewerNavPrev" class="viewer-nav-btn viewer-nav-prev"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button id="viewerNavNext" class="viewer-nav-btn viewer-nav-next"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        <div class="viewer-content">
            <button id="closeViewer" class="viewer-close"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            <div id="viewerImage" class="viewer-image"></div>
            <aside class="viewer-sidebar">
                <section><h3 data-i18n="information"></h3><div id="viewerInfo"></div></section>
                <section><h3 data-i18n="actions"></h3><div id="viewerActions" class="viewer-actions"></div></section>
                <section><h3 data-i18n="tags"></h3><div id="viewerTagsDisplay" class="tag-group-chips"></div></section>
            </aside>
        </div>
    </div>

    
    <div id="uploadModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content upload-modal-content">
            <button class="modal-close" id="closeUploadModal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>

            <div class="upload-modal-header">
                <h2 data-i18n="uploadFile"></h2>
                <div class="upload-mode-tabs" role="tablist">
                    <button type="button" class="upload-mode-tab active" data-mode="upload" data-i18n="modeUpload">Upload</button>
                    <button type="button" class="upload-mode-tab" data-mode="import" data-i18n="modeImport">Import</button>
                </div>
            </div>

            <div class="upload-modal-body">
                <div class="upload-modal-preview">
                    <div id="uploadModePanel" class="upload-mode-panel">
                        <div class="upload-area" id="dropArea">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
                            <p data-i18n="dragDrop"></p>
                            <input type="file" id="fileInput" style="display:none" />
                            <div id="fileInfo" class="file-info hidden"></div>
                        </div>
                    </div>

                    <div id="importModePanel" class="upload-mode-panel hidden">
                        <div class="import-url-row">
                            <input type="url" id="importUrlInput" data-i18n-placeholder="importUrlPlaceholder" placeholder="https://..." autocomplete="off" />
                            <button type="button" id="importFetchBtn" class="primary-btn" data-i18n="fetchFromUrl">Fetch</button>
                        </div>
                        <p class="setting-hint import-url-hint" data-i18n="importUrlHint"></p>
                        <div class="upload-area import-preview-area" id="importPreviewArea">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
                            <p data-i18n="importWaiting"></p>
                        </div>
                        <div id="importFileInfo" class="file-info hidden"></div>
                    </div>
                </div>

                <div class="upload-modal-side">
                    <div class="settings-form upload-form-fields">
                        <div class="upload-field">
                            <label data-i18n="displayNameLabel"></label>
                            <div class="display-name-row">
                                <input type="text" id="uploadDisplayName" data-i18n-placeholder="displayNameLabel" />
                                <button type="button" id="generateNameBtn" class="generate-name-btn" data-i18n-title="generateShortName" title="Generate short name">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="23 4 23 10 17 10"/>
                                        <polyline points="1 20 1 14 7 14"/>
                                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="upload-field">
                            <label data-i18n="descriptionLabel"></label>
                            <textarea id="uploadDescription" data-i18n-placeholder="descriptionLabel" rows="3"></textarea>
                        </div>

                        <div class="upload-field upload-field-tags">
                            <label data-i18n="tags"></label>
                            <div class="tag-edit-input-row">
                                <input type="text" id="uploadTagsAddInput" data-i18n-placeholder="enterTag" autocomplete="off" />
                                <button id="uploadTagsAddBtn" class="primary-btn" data-i18n="addTag"></button>
                            </div>
                            <div id="uploadTagsContainer" class="tag-group-chips upload-tags-chips"></div>
                        </div>

                        <div id="stagesContainer" class="stages-container"></div>

                        <button id="uploadSubmitBtn" class="primary-btn rounded upload-submit-btn" data-i18n="upload"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div id="editTagsModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeEditTagsModal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            <h2 data-i18n="editTagsTitle"></h2>
            <div class="tag-edit-modal">
                <div class="tag-edit-input-row">
                    <input type="text" id="editTagsInputModal" data-i18n-placeholder="enterTag" autocomplete="off" />
                    <button id="addTagModalBtn" class="primary-btn" data-i18n="addTag"></button>
                </div>
                <div id="editTagsList" class="tag-group-chips"></div>
                <div class="modal-actions">
                    <button id="saveTagsModalBtn" class="primary-btn" data-i18n="save"></button>
                    <button id="cancelTagsModalBtn" data-i18n="cancel"></button>
                </div>
            </div>
        </div>
    </div>

    
    <div id="editInfoModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeEditInfoModal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <h2 data-i18n="editInfoTitle"></h2>
            <div class="edit-info-modal">
                <div class="edit-info-field">
                    <label data-i18n="displayNameLabel"></label>
                    <div class="display-name-row">
                        <input type="text" id="editInfoDisplayName" data-i18n-placeholder="displayNameLabel" />
                        <button type="button" id="generateEditNameBtn" class="generate-name-btn" data-i18n-title="generateShortName" title="Generate short name">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"/>
                                <polyline points="1 20 1 14 7 14"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="edit-info-field">
                    <label data-i18n="descriptionLabelShort"></label>
                    <textarea id="editInfoDescription" data-i18n-placeholder="descriptionLabelShort" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button id="saveInfoBtn" class="primary-btn" data-i18n="saveChanges"></button>
                    <button id="cancelInfoBtn" data-i18n="cancel"></button>
                </div>
            </div>
        </div>
    </div>

    
    <div id="userModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content settings-modal">
            <button class="modal-close" id="closeUserModal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            <div class="settings-header">
                <h2 data-i18n="settingsTitle"></h2>
            </div>

            <div class="settings-body">
            <div class="settings-tabs">
                <button class="settings-tab active" data-tab="display" data-i18n="displaySettings"></button>
                <button class="settings-tab" data-tab="account" data-i18n="account"></button>
                <button class="settings-tab" data-tab="booru" data-i18n="booruTab">Booru</button>
                <button class="settings-tab" data-tab="tags" data-i18n="tagsTab">Tags</button>
                <button class="settings-tab" data-tab="language" data-i18n="language"></button>
                <button class="settings-tab admin-only hidden" data-tab="server" data-i18n="server"></button>
                <button class="settings-tab admin-only hidden" data-tab="users" data-i18n="users"></button>
                <button class="settings-tab admin-only hidden" data-tab="logs" data-i18n="logs"></button>
            </div>

            <div class="settings-panels">
                <div class="settings-panel active" id="panel-display">
                    <h3 data-i18n="galleryDisplaySettings"></h3>
                    <div class="settings-group">
                        <div class="setting-item">
                            <label data-i18n="itemsPerPage"></label>
                            <input type="number" id="displayLimit" value="27" min="9" max="100" />
                        </div>
                        <div class="setting-item">
                            <label data-i18n="cardHeight"></label>
                            <input type="number" id="displayRowHeight" value="250" min="150" max="500" />
                        </div>
                        <div class="setting-item">
                            <label data-i18n="cardWidth"></label>
                            <input type="number" id="displayCardWidth" value="220" min="120" max="400" />
                        </div>
                    </div>
                    <button id="saveDisplaySettingsBtn" class="primary-btn" data-i18n="saveSettings"></button>
                </div>

                <div class="settings-panel" id="panel-account">
                    <h3 data-i18n="accountSettings"></h3>
                    <div class="settings-group">
                        <div class="setting-item">
                            <label data-i18n="username"></label>
                            <input type="text" id="newUsername" />
                            <button id="changeUsernameBtn" class="primary-btn" data-i18n="changeUsername"></button>
                        </div>
                        <div class="setting-divider"></div>
                        <div class="setting-item">
                            <label data-i18n="oldPassword"></label>
                            <input type="password" id="oldPassword" />
                        </div>
                        <div class="setting-item">
                            <label data-i18n="newPassword"></label>
                            <input type="password" id="newPassword" />
                        </div>
                        <div class="setting-item">
                            <label data-i18n="confirmPassword"></label>
                            <input type="password" id="confirmPassword" />
                        </div>
                        <button id="changePasswordBtn" class="primary-btn" data-i18n="changePassword"></button>
                    </div>
                </div>

                <div class="settings-panel" id="panel-server">
                    <h3 data-i18n="serverSettings"></h3>
                    <div class="settings-group">
                        <div class="setting-item">
                            <label data-i18n="serverPort"></label>
                            <input type="number" id="accessPort" min="1" max="65535" value="3001" />
                        </div>
                        <div class="setting-item setting-item-switch">
                            <span class="switch-text" data-i18n="localhostOnly"></span>
                            <label class="switch" title="">
                                <input type="checkbox" id="accessLocalhostOnly" />
                                <span class="switch-slider"></span>
                            </label>
                        </div>
                        <p class="setting-hint" data-i18n="localhostOnlyHint"></p>
                        <div class="setting-item setting-item-switch">
                            <span class="switch-text" data-i18n="disableRegistration"></span>
                            <label class="switch" title="">
                                <input type="checkbox" id="accessRegistrationDisabled" />
                                <span class="switch-slider"></span>
                            </label>
                        </div>
                        <p class="setting-hint" data-i18n="disableRegistrationHint"></p>
                        <div class="setting-item">
                            <label data-i18n="serverLanguage"></label>
                            <select id="serverLanguageSelect">
                                <option value="en">English</option>
                                <option value="ru">Русский</option>
                                <option value="zh">中文</option>
                                <option value="de">Deutsch</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="pl">Polski</option>
                                <option value="uk">Українська</option>
                            </select>
                        </div>
                        <p class="setting-hint" data-i18n="serverLanguageHint"></p>
                        <p id="accessRestartHint" class="setting-hint access-restart-hint hidden" data-i18n="restartRequiredHint"></p>
                    </div>
                    <button id="saveAccessSettingsBtn" class="primary-btn" data-i18n="saveSettings"></button>
                </div>

                <div class="settings-panel" id="panel-users">
                    <h3 data-i18n="manageUsers"></h3>
                    <div id="usersListContainer" class="users-list-container">
                        <p class="setting-hint" data-i18n="loadingUsers"></p>
                    </div>
                </div>

                <div class="settings-panel" id="panel-booru">
                    <h3 data-i18n="booruTab">Booru</h3>
                    <p class="setting-hint" data-i18n="booruTabHint"></p>
                    <div id="booruCredentialsList" class="booru-credentials-list">
                        <p class="setting-hint" data-i18n="loadingBooruCreds"></p>
                    </div>
                </div>

                <div class="settings-panel" id="panel-tags">
                    <h3 data-i18n="tagsTab">Tags</h3>
                    <p class="setting-hint" data-i18n="tagsTabHint"></p>
                    <div class="tags-manage-toolbar">
                        <input type="search" id="tagsManageSearch" data-i18n-placeholder="searchTags" placeholder="Search tags…" autocomplete="off" />
                    </div>
                    <div id="tagsManageList" class="tags-manage-list">
                        <p class="setting-hint" data-i18n="loadingTags">Loading…</p>
                    </div>
                </div>

                <div class="settings-panel" id="panel-language">
                    <h3 data-i18n="language"></h3>
                    <div class="settings-group">
                        <div class="setting-item">
                            <label data-i18n="selectLanguage"></label>
                            <select id="languageSelect">
                                <option value="en">English</option>
                                <option value="ru">Русский</option>
                                <option value="zh">中文</option>
                                <option value="de">Deutsch</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="pl">Polski</option>
                                <option value="uk">Українська</option>
                            </select>
                        </div>
                        <button id="saveLanguageBtn" class="primary-btn" data-i18n="applyLanguage"></button>
                    </div>
                </div>

                <div class="settings-panel" id="panel-logs">
                    <h3 data-i18n="serverLogs"></h3>
                    <pre id="logsContainer"></pre>
                </div>
            </div>
            </div>
        </div>
    </div>

    
    <div id="authModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content auth-modal">
            <div class="auth-brand">
                <div class="auth-logo">
                    <img src="/logo.png" alt="OPEN Booru" style="max-width:80px; height:auto; display:block; margin:0 auto;">
                </div>
                <h1 data-i18n="appTitle"></h1>
                <p data-i18n="authSubtitle"></p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" data-i18n="login"></button>
                <button class="auth-tab" data-tab="register" data-i18n="register"></button>
            </div>

            <div id="authFormLogin" class="auth-form-panel active">
                
                <div class="auth-field">
                    <label data-i18n="username"></label>
                    <input type="text" id="authUsernameLogin" data-i18n-placeholder="username" autocomplete="username" />
                </div>
                <div class="auth-field">
                    <label data-i18n="password"></label>
                    <input type="password" id="authPasswordLogin" data-i18n-placeholder="password" autocomplete="current-password" />
                </div>
                <button id="authLoginBtn" class="primary-btn" data-i18n="login"></button>
            </div>

            <div id="authFormRegister" class="auth-form-panel">
                <div class="auth-field">
                    <label data-i18n="username"></label>
                    <input type="text" id="authUsernameRegister" data-i18n-placeholder="username" autocomplete="username" />
                </div>
                <div class="auth-field">
                    <label data-i18n="password"></label>
                    <input type="password" id="authPasswordRegister" data-i18n-placeholder="password" autocomplete="new-password" />
                </div>
                <div class="auth-field">
                    <label data-i18n="confirmPassword"></label>
                    <input type="password" id="authConfirmRegister" data-i18n-placeholder="confirmPassword" autocomplete="new-password" />
                </div>
                <button id="authRegisterBtn" class="primary-btn" data-i18n="register"></button>
            </div>

            <div id="authError" class="auth-error hidden"></div>
        </div>
    </div>

    
    
    <div id="booruCredsModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content" style="max-width:440px">
            <button class="modal-close" id="closeBooruCredsModal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <h2 id="booruCredsModalTitle" data-i18n="booruCredsTitle"></h2>
            <p class="setting-hint" id="booruCredsModalHint" data-i18n="booruCredsHint"></p>
            <input type="hidden" id="booruCredsSite" />
            <div class="settings-form">
                <div class="setting-item" id="booruCredsAccountRow">
                    <label id="booruCredsAccountLabel" data-i18n="booruUserId"></label>
                    <input type="text" id="booruCredsAccountId" autocomplete="off" />
                </div>
                <div class="setting-item">
                    <label data-i18n="booruApiKey"></label>
                    <input type="password" id="booruCredsApiKey" autocomplete="off" />
                </div>
                <p class="setting-hint" id="booruCredsHelp"></p>
                <div id="booruCredsStatus" class="setting-hint" style="min-height:1.2em"></div>
                <div class="modal-actions">
                    <button id="saveBooruCredsBtn" class="primary-btn" data-i18n="saveAndVerify"></button>
                    <button id="cancelBooruCredsBtn" data-i18n="cancel"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="customModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2 id="modalTitle"></h2>
            <p id="modalMessage"></p>
            <div id="modalButtons" class="modal-actions" style="justify-content: center;"></div>
        </div>
    </div>

	<script src="/lib/spark-md5.min.js"></script>
	<script type="importmap">
	{
		"imports": {
			"./toast.js": "/js/toast.js",
			"./user-locales.js": "/js/user-locales.js"
		}
	}
	</script>
	<script type="module" src="/js/app.js"></script>
</body>
</html>
